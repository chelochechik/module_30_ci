name: PR checks

on:
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Black
        run: black --check --diff main.py models.py database.py schemas.py test_main.py

      - name: Isort
        run: isort --check-only --profile black main.py models.py database.py schemas.py test_main.py

      - name: Flake8
        run: flake8 main.py models.py database.py schemas.py test_main.py

      - name: Mypy
        run: mypy main.py models.py database.py schemas.py

      - name: Pytest
        run: pytest -v
